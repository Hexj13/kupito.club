name: CI/CD MD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  prepare:
    name: Prepare platform files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            core/frontend/package-lock.json
            core/backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Prepare platform files
        run: npm run prepare:build

      - name: Verify platform files
        run: |
          for f in \
            core/frontend/lib/locales/ro.json \
            core/frontend/lib/locales/ru.json \
            core/frontend/lib/locales/en.json \
            core/frontend/lib/theme/colors.ts \
            core/frontend/lib/theme.json \
            core/frontend/lib/config/site.ts \
            core/frontend/lib/config/parsers.ts \
            core/backend/src/common/i18n/ro.json \
            core/backend/src/common/i18n/ru.json \
            core/backend/src/common/i18n/en.json \
            core/backend/src/common/config/parsers.ts \
            core/frontend/public/logo.png \
            core/backend/assets/watermark/logo.png \
            core/mobile/src/i18n/ro.json \
            core/mobile/src/i18n/ru.json \
            core/mobile/src/i18n/en.json; do
            if [ ! -f "$f" ]; then
              echo "Error: Missing expected file: $f"
              exit 1
            fi
          done
          echo "All platform files copied and verified"

  frontend-check:
    name: Frontend check
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            core/frontend/package-lock.json
            core/backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Prepare platform files
        run: npm run prepare:build

      - name: Install frontend dependencies
        working-directory: ./core/frontend
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: core/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('core/frontend/package-lock.json') }}-${{ hashFiles('core/frontend/**/*.[jt]s', 'core/frontend/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('core/frontend/package-lock.json') }}-

      - name: Lint
        working-directory: ./core/frontend
        run: npm run lint

      - name: Lint styles
        working-directory: ./core/frontend
        run: npm run lint:styles

      - name: Check formatting
        working-directory: ./core/frontend
        run: npm run format:check

      - name: Run tests
        working-directory: ./core/frontend
        run: npm test -- --passWithNoTests

      - name: Build
        working-directory: ./core/frontend
        env:
          NEXT_PUBLIC_COUNTRY: md
          NEXT_PUBLIC_SITE_URL: https://kupito.club
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}
        run: npm run build

      - name: Verify build
        working-directory: ./core/frontend
        run: |
          if [ ! -d ".next" ]; then
            echo "Build failed: .next directory not found"
            exit 1
          fi
          echo "Frontend build OK"

  backend-check:
    name: Backend check
    runs-on: ubuntu-latest
    needs: prepare

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kupito
          POSTGRES_PASSWORD: kupito123
          POSTGRES_DB: kupito_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kupito"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            core/frontend/package-lock.json
            core/backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Prepare platform files
        run: npm run prepare:build

      - name: Install backend dependencies
        working-directory: ./core/backend
        run: npm ci

      - name: Lint
        working-directory: ./core/backend
        run: npm run lint:check

      - name: Check formatting
        working-directory: ./core/backend
        run: npm run format:check

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U kupito; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Run tests
        working-directory: ./core/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: kupito
          DB_PASSWORD: kupito123
          DB_NAME: kupito_test
          JWT_SECRET: test-secret-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test

      - name: Run integration tests
        working-directory: ./core/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: kupito
          DB_PASSWORD: kupito123
          DB_NAME: kupito_test
          JWT_SECRET: test-secret-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: timeout 300 npm run test:integration

      - name: Build
        working-directory: ./core/backend
        run: npm run build

      - name: Verify build
        working-directory: ./core/backend
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/main.js" ]; then
            echo "Build failed: dist/main.js not found"
            exit 1
          fi
          echo "Backend build OK"

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    needs: prepare
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            core/frontend/package-lock.json
            core/backend/package-lock.json

      - name: Audit frontend
        working-directory: ./core/frontend
        run: npm audit --omit=dev --audit-level=high || true

      - name: Audit backend
        working-directory: ./core/backend
        run: npm audit --omit=dev --audit-level=high || true

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render frontend deploy hook
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_FRONTEND_DEPLOY_HOOK not set — skipping (Render auto-deploy on push main will trigger)."
            exit 0
          fi
          echo "Triggering frontend deploy..."
          curl -fsS -X POST "$HOOK"
          echo "Frontend deploy hook sent"

      - name: Trigger Render backend deploy hook
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_BACKEND_DEPLOY_HOOK not set — skipping (Render auto-deploy on push main will trigger)."
            exit 0
          fi
          echo "Triggering backend deploy..."
          curl -fsS -X POST "$HOOK"
          echo "Backend deploy hook sent"
