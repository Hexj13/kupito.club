name: CI/CD MD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    name: Build and Deploy MD
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kupito
          POSTGRES_PASSWORD: kupito123
          POSTGRES_DB: kupito_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kupito"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Copy platform files to core
        run: |
          for dir in locales theme config assets; do
            if [ ! -d "$dir" ]; then
              echo "Error: Required directory '$dir' not found"
              exit 1
            fi
          done

          mkdir -p core/frontend/lib/locales
          rm -rf core/frontend/lib/locales/backend
          cp locales/ro.json locales/ru.json core/frontend/lib/locales/

          mkdir -p core/backend/src/common/i18n
          cp locales/backend/*.json core/backend/src/common/i18n/

          cp -r theme core/frontend/lib/
          cp -r config core/frontend/lib/

          cp -r assets/frontend/public/* core/frontend/public/
          cp -r assets/backend/watermark core/backend/assets/

          for f in \
            core/frontend/lib/locales/ro.json \
            core/frontend/lib/locales/ru.json \
            core/frontend/lib/theme/colors.ts \
            core/frontend/lib/config/site.ts \
            core/backend/src/common/i18n/ro.json \
            core/backend/src/common/i18n/ru.json \
            core/backend/src/common/i18n/en.json \
            core/frontend/public/logo.png \
            core/backend/assets/watermark/logo.png; do
            if [ ! -f "$f" ]; then
              echo "Error: Missing expected file: $f"
              exit 1
            fi
          done
          echo "All platform files copied and verified"

      - name: Install frontend dependencies
        working-directory: ./core/frontend
        run: npm ci

      - name: Run frontend linter
        working-directory: ./core/frontend
        run: npm run lint

      - name: Run frontend style linter
        working-directory: ./core/frontend
        run: npm run lint:styles

      - name: Check formatting (frontend)
        working-directory: ./core/frontend
        run: npm run format:check

      - name: Run frontend tests
        working-directory: ./core/frontend
        run: npm test -- --passWithNoTests

      - name: Install backend dependencies
        working-directory: ./core/backend
        run: npm ci

      - name: Run backend linter
        working-directory: ./core/backend
        run: npm run lint:check

      - name: Check formatting (backend)
        working-directory: ./core/backend
        run: npm run format:check

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U kupito; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Run backend tests
        working-directory: ./core/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: kupito
          DB_PASSWORD: kupito123
          DB_NAME: kupito_test
          JWT_SECRET: test-secret-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test

      - name: Run backend integration tests
        working-directory: ./core/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: kupito
          DB_PASSWORD: kupito123
          DB_NAME: kupito_test
          JWT_SECRET: test-secret-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: timeout 300 npm run test:integration

      - name: TypeScript check (frontend)
        working-directory: ./core/frontend
        run: npx tsc --noEmit

      - name: TypeScript check (backend)
        working-directory: ./core/backend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: ./core/frontend
        env:
          NEXT_PUBLIC_COUNTRY: md
          NEXT_PUBLIC_SITE_URL: https://kupito.club
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}
        run: npm run build

      - name: Verify frontend build
        working-directory: ./core/frontend
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build failed: .next directory not found"
            exit 1
          fi
          echo "✅ Frontend build successful"

      - name: Build backend
        working-directory: ./core/backend
        run: npm run build

      - name: Verify backend build
        working-directory: ./core/backend
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/main.js" ]; then
            echo "❌ Build failed: dist/main.js not found"
            exit 1
          fi
          echo "✅ Backend build successful"

      - name: Deploy
        # Add your deployment steps here
        run: |
          echo "Deploy to production..."
          # Your deployment commands
