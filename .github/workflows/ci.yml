name: CI/CD MK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Deploy MK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy locale files to core
        run: |
          if [ ! -d "locales" ] || [ ! -d "theme" ] || [ ! -d "config" ]; then
            echo "❌ Error: Required directories (locales, theme, config) not found"
            exit 1
          fi
          cp -r locales core/frontend/lib/
          cp -r theme core/frontend/lib/
          cp -r config core/frontend/lib/
          
          if [ ! -f "core/frontend/lib/locales/mk.json" ]; then
            echo "❌ Error: Failed to copy locales/mk.json"
            exit 1
          fi
          if [ ! -f "core/frontend/lib/theme/colors.ts" ]; then
            echo "❌ Error: Failed to copy theme/colors.ts"
            exit 1
          fi
          if [ ! -f "core/frontend/lib/config/site.ts" ]; then
            echo "❌ Error: Failed to copy config/site.ts"
            exit 1
          fi
          echo "✅ All platform files copied successfully"

      - name: Install frontend dependencies
        working-directory: ./core/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./core/frontend
        run: npm test -- --passWithNoTests

      - name: Install backend dependencies
        working-directory: ./core/backend
        run: npm ci

      - name: Build frontend
        working-directory: ./core/frontend
        env:
          NEXT_PUBLIC_COUNTRY: mk
          NEXT_PUBLIC_SITE_URL: https://kupito.club
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}
        run: npm run build

      - name: Verify frontend build
        working-directory: ./core/frontend
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build failed: .next directory not found"
            exit 1
          fi
          echo "✅ Frontend build successful"

      - name: Build backend
        working-directory: ./core/backend
        run: npm run build

      - name: Verify backend build
        working-directory: ./core/backend
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/main.js" ]; then
            echo "❌ Build failed: dist/main.js not found"
            exit 1
          fi
          echo "✅ Backend build successful"

      - name: Deploy
        # Add your deployment steps here
        run: |
          echo "Deploy to production..."
          # Your deployment commands
