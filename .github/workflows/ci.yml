name: CI/CD MD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Deploy MD
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kupito
          POSTGRES_PASSWORD: kupito123
          POSTGRES_DB: kupito_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kupito"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy locale files to core
        run: |
          if [ ! -d "locales" ] || [ ! -d "theme" ] || [ ! -d "config" ]; then
            echo "❌ Error: Required directories (locales, theme, config) not found"
            exit 1
          fi
          cp -r locales core/frontend/lib/
          cp -r theme core/frontend/lib/
          cp -r config core/frontend/lib/
          
          if [ ! -f "core/frontend/lib/locales/ro.json" ]; then
            echo "❌ Error: Failed to copy locales/ro.json"
            exit 1
          fi
          if [ ! -f "core/frontend/lib/locales/ru.json" ]; then
            echo "❌ Error: Failed to copy locales/ru.json"
            exit 1
          fi
          if [ ! -f "core/frontend/lib/theme/colors.ts" ]; then
            echo "❌ Error: Failed to copy theme/colors.ts"
            exit 1
          fi
          if [ ! -f "core/frontend/lib/config/site.ts" ]; then
            echo "❌ Error: Failed to copy config/site.ts"
            exit 1
          fi
          echo "✅ All platform files copied successfully"

      - name: Install frontend dependencies
        working-directory: ./core/frontend
        run: npm ci

      - name: Run frontend linter
        working-directory: ./core/frontend
        run: npm run lint

      - name: Run frontend style linter
        working-directory: ./core/frontend
        run: npm run lint:styles

      - name: Check formatting (frontend)
        working-directory: ./core/frontend
        run: npm run format:check

      - name: Run frontend tests
        working-directory: ./core/frontend
        run: npm test -- --passWithNoTests

      - name: Install backend dependencies
        working-directory: ./core/backend
        run: npm ci

      - name: Run backend linter
        working-directory: ./core/backend
        run: npm run lint:check

      - name: Check formatting (backend)
        working-directory: ./core/backend
        run: npm run format:check

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U kupito; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Run backend tests
        working-directory: ./core/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: kupito
          DB_PASSWORD: kupito123
          DB_NAME: kupito_test
          JWT_SECRET: test-secret-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test

      - name: Run backend integration tests
        working-directory: ./core/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: kupito
          DB_PASSWORD: kupito123
          DB_NAME: kupito_test
          JWT_SECRET: test-secret-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: timeout 300 npm run test:integration

      - name: TypeScript check (frontend)
        working-directory: ./core/frontend
        run: npx tsc --noEmit

      - name: TypeScript check (backend)
        working-directory: ./core/backend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: ./core/frontend
        env:
          NEXT_PUBLIC_COUNTRY: md
          NEXT_PUBLIC_SITE_URL: https://kupito.club
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}
        run: npm run build

      - name: Verify frontend build
        working-directory: ./core/frontend
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build failed: .next directory not found"
            exit 1
          fi
          echo "✅ Frontend build successful"

      - name: Build backend
        working-directory: ./core/backend
        run: npm run build

      - name: Verify backend build
        working-directory: ./core/backend
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/main.js" ]; then
            echo "❌ Build failed: dist/main.js not found"
            exit 1
          fi
          echo "✅ Backend build successful"

      - name: Deploy
        # Add your deployment steps here
        run: |
          echo "Deploy to production..."
          # Your deployment commands
